services:
  - type: web
    name: health-platform-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: health-platform-db
          property: connectionString
      - key: APP_PEPPER
        generateValue: true
      - key: ALLOWED_ORIGIN
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: health-platform-db
    databaseName: health_platform
    user: health_platform
